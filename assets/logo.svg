<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Icon Badge -->
  <g transform="translate(4, 4)">
    <!-- Rounded Squircle Background -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#btGrad)" filter="url(#shadow)"/>
    
    <!-- Sound Waves / Equalizer Bars -->
    <rect x="12" y="24" width="4" height="12" rx="2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="18" y="17" width="4" height="26" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="24" y="11" width="4" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="30" y="19" width="4" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="36" y="14" width="4" height="32" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="42" y="23" width="4" height="14" rx="2" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Microphone / Studio Dot -->
    <circle cx="28" cy="8" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Typography: Biswas Tech -->
  <text x="72" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#0F172A" letter-spacing="-0.5">
    BISWAS <tspan fill="#2563EB">TECH</tspan>
  </text>
  
  <!-- Sub-label: AUDIO RECORDING STUDIO -->
  <text x="73" y="46" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#64748B" letter-spacing="1.8">
    AUDIO RECORDING STUDIO
  </text>
</svg>

